name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed plan after the production environment approval
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tcg-production-mutation
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
  DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
  SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ADMIN_ACCESS_KEY_ID }}
  SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_ADMIN_SECRET_ACCESS_KEY }}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true
      - uses: extractions/setup-just@v4
      - uses: jdx/mise-action@v5
        with:
          install_args: terraform
      - name: Initialize and save a plan
        id: plan
        shell: bash
        env:
          TF_INPUTS: ${{ secrets.TF_PRODUCTION_VARS_JSON }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$TF_INPUTS" > infra/environments/production/terraform.tfvars.json
          just infra-init
          just infra-plan
          terraform -chdir=infra/environments/production show -no-color .terraform/review.tfplan > "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "plan_hash=$(sha256sum infra/environments/production/.terraform/review.tfplan | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Encrypt the plan before storing it for approval
        if: inputs.apply
        env:
          PLAN_KEY: ${{ secrets.INFRA_PLAN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$PLAN_KEY"
          tar -C infra/environments/production/.terraform -cf "$RUNNER_TEMP/plan.tar" review.tfplan review.commit
          gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
            --passphrase-fd 3 --output "$RUNNER_TEMP/plan.gpg" "$RUNNER_TEMP/plan.tar" 3<<<"$PLAN_KEY"
      - uses: actions/upload-artifact@v7
        if: inputs.apply
        with:
          name: encrypted-infrastructure-plan
          path: ${{ runner.temp }}/plan.gpg
          retention-days: 1
      - name: Remove plaintext plan files
        if: always()
        run: rm -f infra/environments/production/.terraform/review.* "$RUNNER_TEMP/plan.tar"

  apply:
    if: inputs.apply
    needs: plan
    runs-on: ubuntu-latest
    environment: production-infrastructure
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true
      - uses: extractions/setup-just@v4
      - uses: jdx/mise-action@v5
        with:
          install_args: terraform
      - uses: actions/download-artifact@v8
        with:
          name: encrypted-infrastructure-plan
          path: ${{ runner.temp }}
      - name: Apply the exact reviewed plan
        shell: bash
        env:
          PLAN_KEY: ${{ secrets.INFRA_PLAN_ENCRYPTION_KEY }}
          EXPECTED_HASH: ${{ needs.plan.outputs.plan_hash }}
        run: |
          set -euo pipefail
          umask 077
          just infra-init
          gpg --batch --yes --decrypt --pinentry-mode loopback --passphrase-fd 3 \
            --output "$RUNNER_TEMP/plan.tar" "$RUNNER_TEMP/plan.gpg" 3<<<"$PLAN_KEY"
          tar -C infra/environments/production/.terraform -xf "$RUNNER_TEMP/plan.tar"
          echo "$EXPECTED_HASH  infra/environments/production/.terraform/review.tfplan" | sha256sum --check
          just infra-apply
      - name: Remove plaintext plan files
        if: always()
        run: rm -f infra/environments/production/.terraform/review.* "$RUNNER_TEMP/plan.tar"
