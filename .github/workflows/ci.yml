name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.detect.outputs.server }}
      app: ${{ steps.detect.outputs.app }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test change detection
        run: bash .github/scripts/determine-affected-areas.test.sh

      - name: Determine affected areas
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash .github/scripts/determine-affected-areas.sh

  server:
    name: Server checks
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://tcg_user:tcg_password@localhost:5432/tcg
      BETTER_AUTH_URL: http://localhost:8080
      BETTER_AUTH_SECRET: ci-only-secret
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Run server quality checks
        run: just quality-server

      - name: Run repository tooling checks
        run: |
          just check-versions
          just typecheck-scripts

      - name: Configure Docker Hub mirror
        # Prefer cached images so shared runner IPs do not exhaust Docker Hub's pull limit.
        run: |
          sudo python3 scripts/configure-docker-hub-mirror.py
          sudo systemctl restart docker

      - name: Run server tests
        env:
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io
        run: just test-server

      - name: Smoke test server image
        run: just test-server-image

      - name: Run repository tooling tests
        run: just test-scripts

  app-macos:
    name: macOS app checks
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      TCG_APP_CODE_SIGNING_ALLOWED: 'NO'
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Identify Swift toolchain
        id: swift-toolchain
        run: |
          echo "version=$(xcodebuild -version | tr '\n ' '--')" >> "$GITHUB_OUTPUT"
          echo "TCG_APP_SOURCE_PACKAGES=$RUNNER_TEMP/tcg-source-packages" >> "$GITHUB_ENV"

      - name: Cache Swift package downloads
        id: swift-packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tcg-source-packages
          key: swift-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.version }}-${{ hashFiles('app/**/Package.resolved') }}
          restore-keys: |
            swift-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.version }}-

      - name: Trust pinned Swift package plugin
        run: |
          install -d "$HOME/Library/org.swift.swiftpm/security"
          install -m 600 .github/config/swiftpm-plugins.json "$HOME/Library/org.swift.swiftpm/security/plugins.json"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run localization tooling quality checks
        run: just quality-tools

      - name: Run app quality checks
        run: just quality-app

      - name: Run macOS app tests
        run: just test-app-macos

      - name: Verify macOS localization coverage
        run: |
          just test-localization-check
          just check-localizations-macos

      - name: Collect failed snapshots
        if: failure()
        run: bash .github/scripts/collect-snapshot-failures.sh "$RUNNER_TEMP/macos-snapshot-failures"

      - name: Upload failed snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-snapshot-failures
          path: ${{ runner.temp }}/macos-snapshot-failures
          if-no-files-found: ignore
          retention-days: 7

  app-ios:
    name: iOS snapshot checks
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      TCG_APP_IOS_TEST_DESTINATION: platform=iOS Simulator,OS=27.0,name=iPhone 17
      TCG_IOS_SNAPSHOT_SIMULATOR: iPhone 17
      TCG_APP_CODE_SIGNING_ALLOWED: 'NO'
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          node-version-file: .node-version
          install: false

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Identify Swift toolchain
        id: swift-toolchain
        run: |
          echo "version=$(xcodebuild -version | tr '\n ' '--')" >> "$GITHUB_OUTPUT"
          echo "TCG_APP_SOURCE_PACKAGES=$RUNNER_TEMP/tcg-source-packages" >> "$GITHUB_ENV"

      - name: Cache Swift package downloads
        id: swift-packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tcg-source-packages
          key: swift-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.version }}-${{ hashFiles('app/**/Package.resolved') }}
          restore-keys: |
            swift-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.version }}-

      - name: Trust pinned Swift package plugin
        run: |
          install -d "$HOME/Library/org.swift.swiftpm/security"
          install -m 600 .github/config/swiftpm-plugins.json "$HOME/Library/org.swift.swiftpm/security/plugins.json"

      - name: Show Xcode and simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Run iOS snapshots
        env:
          TCG_SWIFT_PACKAGE_CACHE_HIT: ${{ steps.swift-packages.outputs.cache-hit }}
        run: >-
          exec node scripts/run-ios-snapshots-ci.ts
          -jobs 2 -parallel-testing-enabled NO ONLY_ACTIVE_ARCH=YES
          -collect-test-diagnostics never
          -resultBundlePath "$RUNNER_TEMP/ios-snapshots.xcresult"
          "OBJROOT=$RUNNER_TEMP/ios-intermediates"

      - name: Verify iOS localization coverage
        run: |
          started=$SECONDS
          status=0
          just check-localizations-ios --build-root "$RUNNER_TEMP/ios-intermediates" --configuration Debug-iphonesimulator || status=$?
          printf '\nLocalization verification: %ss (exit %s).\n' "$((SECONDS - started))" "$status" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Collect failed snapshots
        if: failure() && !cancelled()
        run: bash .github/scripts/collect-snapshot-failures.sh "$RUNNER_TEMP/ios-snapshot-failures" "$RUNNER_TEMP/ios-snapshots.xcresult"

      - name: Upload failed snapshots
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ios-snapshot-failures
          path: ${{ runner.temp }}/ios-snapshot-failures
          if-no-files-found: ignore
          retention-days: 7
