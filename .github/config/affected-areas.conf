# Files that affect both CI jobs.
BOTH=(
    '.github/workflows/*'
    '.github/scripts/*'
    '.github/config/*'
    justfile
    mise.toml
    package.json
    pnpm-lock.yaml
    pnpm-workspace.yaml
)

# Server code and tooling.
SERVER=(
    'infra/*'
    'deploy/*'
    'server/*'
    'packages/*'
    Dockerfile
    .dockerignore
    'scripts/*'
    docker-compose.yaml
    garage.toml
    vitest.config.ts
    .node-version
    .env.example
    oxfmt.config.ts
    oxlint.config.ts
    'tsconfig.*'
    '.devcontainer/*'
)

# App code and formatting.
APP=('app/*' 'scripts/check-localizations*' 'scripts/run-ios-snapshots-ci*' 'scripts/run-with-xcbeautify*' 'scripts/install-xcbeautify*' 'scripts/test-xcode-formatter*')
