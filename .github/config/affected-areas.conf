# Files that affect both CI jobs.
BOTH=(
    '.github/workflows/*'
    '.github/scripts/*'
    '.github/config/*'
    justfile
    mise.toml
)

# Server code and tooling.
SERVER=(
    'server/*'
    Dockerfile
    .dockerignore
    'scripts/*'
    docker-compose.yaml
    garage.toml
    package.json
    vitest.config.ts
    pnpm-lock.yaml
    pnpm-workspace.yaml
    .node-version
    .env.example
    oxfmt.config.ts
    oxlint.config.ts
    'tsconfig.*'
    '.devcontainer/*'
)

# App code and formatting.
APP=('app/*' .swift-format 'scripts/check-localizations*')
