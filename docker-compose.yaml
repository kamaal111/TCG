services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TCG_DB_NAME:-tcg}
      POSTGRES_USER: ${TCG_DB_USER:-tcg_user}
      POSTGRES_PASSWORD: ${TCG_DB_PASSWORD:-tcg_password}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - '${TCG_DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${TCG_DB_USER:-tcg_user} -d ${TCG_DB_NAME:-tcg}']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ['/garage', '-c', '/etc/garage.toml', 'server']
    ports:
      - '${TCG_STORAGE_PORT:-9000}:3900'
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', '-c', '/etc/garage.toml', 'status']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
    driver: local
  garage_meta:
    driver: local
  garage_data:
    driver: local
