services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    init: true
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    ports:
      - 127.0.0.1:${TCG_DEVCONTAINER_APP_PORT}:${TCG_DEVCONTAINER_APP_PORT}
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      TCG_DEVCONTAINER: '1'
      COMPOSE_PROJECT_NAME: ${TCG_DEVCONTAINER_PROJECT}
      COMPOSE_FILE: ${LOCAL_WORKSPACE_FOLDER}/.devcontainer/compose.services.yaml
      COMPOSE_IGNORE_ORPHANS: 'true'
      DATABASE_URL: postgresql://${TCG_DB_USER:-tcg_user}:${TCG_DB_PASSWORD:-tcg_password}@db:5432/${TCG_DB_NAME:-tcg}
      OBJECT_STORAGE_ENDPOINT: http://garage:3900
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER}:${LOCAL_WORKSPACE_FOLDER}:cached
      - ${GIT_COMMON_DIR}:${GIT_COMMON_DIR}:cached
      - node_modules:${LOCAL_WORKSPACE_FOLDER}/node_modules
      - server_node_modules:${LOCAL_WORKSPACE_FOLDER}/server/node_modules
      - type: bind
        source: ~/.gitconfig
        target: /root/.gitconfig
        read_only: true
        bind:
          create_host_path: false

volumes:
  node_modules:
  server_node_modules:
