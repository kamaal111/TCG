      type: object
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/CardWithPrice'
          description: Owned card entries with daily pricing, newest first
        next_cursor:
          type:
            - string
            - 'null'
          description: Opaque cursor for the next page; null when this is the final page
          example: null
        available_set_names:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
            description: Set name
            example: Romance Dawn
          description: >-
            Distinct owned set names in alphabetical order, scoped by game but
            independent of the set filter
      required:
        - cards
        - next_cursor
        - available_set_names
      title: Cards List Response
      description: >-
        One page of the authenticated user's card collection with complete
        game-scoped set choices
      example:
        cards: []
        available_set_names: []
        next_cursor: null
    CardNotFoundErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message
        code:
          type: string
          enum:
            - CARD_NOT_FOUND
          description: Error code
      required:
        - message
        - code
      title: Card Not Found Error Response
      description: Error response for a missing or inaccessible owned card entry
    DeleteCardsResponse:
      type: object
      properties:
        deleted_ids:
          type: array
          items:
            type: string
            format: uuid
        not_found_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
        - deleted_ids
        - not_found_ids
      title: Delete Cards Response
    DeleteCards:
      type: object
      properties:
        card_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Card entries to delete; duplicates are ignored
      required:
        - card_ids
      title: Delete Cards
    PricingSearchResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/PricedCard'
          description: Ordered matching cards
      required:
        - matches
      title: Pricing Search Response
      description: Card pricing search results
      example:
        matches: []
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
  - url: http://localhost:8080
